[package]
name = "rusvelte"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.19.2"
oxc_allocator = "0.153.0"
oxc_ast = { version = "0.153.0", features = ["serialize"] }
oxc_ast_visit = "0.153.0"
oxc_diagnostics = "0.153.0"
oxc_ecmascript = "0.153.0"
oxc_estree = { version = "0.153.0", features = ["serialize"] }
oxc_parser = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
regex = "1.13.1"
indexmap = "2"
compact_str = "0.10"
rustc-hash = "2"
ryu-js = "1"
smallvec = "1"
serde_json = { version = "1", features = ["preserve_order"] }
unicode-id-start = "1.5.0"

[workspace]
members = ["bindings/node"]
