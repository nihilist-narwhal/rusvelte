# Builds the native module for each platform, tests that it loads and compiles a component,
# and publishes the npm packages (packages/rusvelte/npm/prepare.mjs).
#
# - Push a tag `v<version>` matching packages/rusvelte/package.json to publish (needs the
#   NPM_TOKEN secret).
# - Run it by hand (Actions → Release → Run workflow) for a dry run: everything but the upload,
#   whichever branch or tag it runs on.
#
# Actions are pinned to commits and build tools to versions, so a compromised upstream release
# can't change what gets built and published; update the pins deliberately.
#
# Linux builds target glibc 2.17 (cargo-zigbuild), so they load on old distributions too.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, lib: librusvelte_node.dylib, test: native }
          - { target: x86_64-apple-darwin, os: macos-14, lib: librusvelte_node.dylib, test: none }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, lib: librusvelte_node.so, zig: x86_64-unknown-linux-gnu.2.17, test: native }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, lib: librusvelte_node.so, zig: aarch64-unknown-linux-gnu.2.17, test: native }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, lib: librusvelte_node.so, zig: x86_64-unknown-linux-musl, test: alpine }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, lib: rusvelte_node.dll, test: native }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        # the Rust release builds are made with (bump deliberately, like the other pins)
        run: rustup toolchain install 1.97.1 --profile minimal --target ${{ matrix.target }} && rustup default 1.97.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --locked --release -p rusvelte-node --target ${{ matrix.target }}
      - name: Build (zig)
        if: ${{ matrix.zig }}
        env:
          # a cdylib for musl must link the C runtime dynamically
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}
        run: |
          pip install cargo-zigbuild==0.23.4 ziglang==0.16.0
          cargo zigbuild --locked --release -p rusvelte-node --target ${{ matrix.zig }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} dist/rusvelte.${{ matrix.target }}.node
      - name: Test
        if: ${{ matrix.test == 'native' }}
        shell: bash
        run: node packages/rusvelte/npm/smoke-test.cjs dist/rusvelte.${{ matrix.target }}.node
      - name: Test (Alpine)
        if: ${{ matrix.test == 'alpine' }}
        # pinned image, and a read-only mount so it can't touch the binary that gets uploaded
        run: docker run --rm -v "$PWD:/w:ro" -w /w node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 node packages/rusvelte/npm/smoke-test.cjs dist/rusvelte.${{ matrix.target }}.node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rusvelte.${{ matrix.target }}
          path: dist/rusvelte.${{ matrix.target }}.node

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the tag matches the package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/rusvelte/package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version $version"; exit 1; }
      - name: Prepare packages
        run: node packages/rusvelte/npm/prepare.mjs artifacts npm-out
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # only a pushed tag publishes; a manual run is always a dry run
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then DRY_RUN=""; else DRY_RUN="--dry-run"; fi
          # the platform packages first, so the main package's optional dependencies exist;
          # versions already on npm (from an earlier, partly failed run) are skipped
          for dir in npm-out/platform-* npm-out/compiler; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version > /dev/null 2>&1; then echo "$spec is published already"; continue; fi
            (cd "$dir" && npm publish --access public --provenance $DRY_RUN)
          done
